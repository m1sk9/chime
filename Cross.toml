# aws-lc-sys (reqwest rustls backend) builds C sources via cmake. The musl
# target also needs bindgen (clang/libclang) since it has no prebuilt bindings.
[target.x86_64-unknown-linux-musl]
pre-build = [
    "apt-get update && apt-get install -y --no-install-recommends cmake make clang libclang-dev",
]
